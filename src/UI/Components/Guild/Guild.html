<div id="Guild">
	<div class="titlebar">
		<ui-image src="basic_interface/titlebar_mid.bmp"></ui-image>
		<div class="right">
			<ui-button
				class="base close"
				bg="basic_interface/sys_close_off.bmp"
				hover="basic_interface/sys_close_on.bmp"
			></ui-button>
		</div>
		<div class="clear"></div>
	</div>

	<div class="tabs">
		<!--
		--><button data-flag="0" class="info"><ui-text msg="340">公會資訊</ui-text></button><!--
		--><button data-flag="1" class="members"><ui-text msg="341">成員資訊</ui-text></button><!--
		--><button data-flag="2" class="positions"><ui-text msg="342">職位設定</ui-text></button><!--
		--><button data-flag="3" class="skills"><ui-text msg="343">公會技能</ui-text></button><!--
		--><button data-flag="4" class="history"><ui-text msg="344">逐出紀錄</ui-text></button><!--
		--><button data-flag="6" class="notice"><ui-text msg="345">公會公告</ui-text></button>
	</div>

	<div class="panel">
		<!-- INFO TAB -->
		<div class="content info">
			<div class="name"><ui-text msg="328">公會名稱</ui-text> : <span class="value"></span></div>
			<div class="level"><ui-text msg="329">公會等級</ui-text> : <span class="value"></span></div>
			<div class="master"><ui-text msg="330">會長名稱</ui-text> : <span class="value"></span></div>
			<div class="members">
				<ui-text msg="331">公會成員</ui-text> : <span class="numMember">0</span> /
				<span class="maxMember">0</span>
				<span class="online-icon" data-background="basic_interface/grp_online.bmp"></span>
				<span class="online"></span>
			</div>
			<div class="avglevel"><ui-text msg="332">成員平均等級</ui-text> : <span class="value"></span></div>
			<div class="territory"><ui-text msg="333">領地</ui-text> : <span class="value"></span></div>
			<div class="tendency">
				<!-- Label only, with no value and no separator. The chart is the
				     value. See docs/reference/guild/info-tab-legacy.md -->
				<div class="title"><ui-text msg="334">興趣性向</ui-text></div>
				<div class="righteous">R</div>
				<div class="wiked">W</div>
				<div class="vulgar">V</div>
				<div class="famed">F</div>
				<canvas width="90" height="90"></canvas>
			</div>
			<div class="exp"><ui-text msg="335">EXP</ui-text> : <span class="value"></span></div>
			<div class="emblem"><ui-text msg="336">公會標誌</ui-text></div>
			<!-- The emblem is the picker: one file input, opened by clicking the
			     emblem, by the Edit button or by a drop.
			     See docs/reference/guild/emblem-picker.md -->
			<div class="emblem_container">
				<label class="emblem_pick"><input type="file" accept=".bmp,.gif,image/bmp,image/gif" /></label>
			</div>
			<ui-button class="emblem_edit" bg="btn_edit.bmp" hover="btn_edit_a.bmp" down="btn_edit_b.bmp"></ui-button>

			<div class="tax"><ui-text msg="337">公會繳納點數</ui-text> : <span class="value">0</span></div>
			<div class="ally"><ui-text msg="338">同盟</ui-text></div>
			<div class="ally_list"></div>
			<div class="hostile"><ui-text msg="339">敵對</ui-text></div>
			<div class="hostile_list"></div>
		</div>

		<!-- MEMBERS TAB -->
		<div class="content members">
			<table>
				<thead>
					<tr>
						<th class="name"><ui-text msg="407">名稱</ui-text></th>
						<th class="position"><ui-text msg="503">職位設定</ui-text></th>
						<th class="job"><ui-text msg="504">職業</ui-text></th>
						<th class="level"><ui-text msg="408">等級</ui-text></th>
						<th class="note"><ui-text msg="505">備註</ui-text></th>
						<th class="devotion"><ui-text msg="506">貢獻</ui-text></th>
						<th class="tax"><ui-text msg="507">繳納經驗值</ui-text></th>
					</tr>
				</thead>
				<tbody>
					<tr class="MemberView">
						<td class="name">
							<canvas width="30" height="30"></canvas>
							<span class="value"></span>
							<span class="lastlogin"></span>
						</td>
						<td class="position"></td>
						<td class="job"></td>
						<td class="level"></td>
						<td class="note"></td>
						<td class="devotion"></td>
						<td class="tax"></td>
					</tr>
				</tbody>
			</table>
		</div>

		<!-- POSITIONS TAB -->
		<div class="content positions">
			<table>
				<thead>
					<tr>
						<th class="id"><ui-text msg="510">級別</ui-text></th>
						<th class="title"><ui-text msg="511">職稱</ui-text></th>
						<th class="invite"><ui-text msg="512">邀請</ui-text></th>
						<th class="punish"><ui-text msg="513">懲處</ui-text></th>
						<th class="storage"><ui-text msg="2499">倉庫</ui-text></th>
						<th class="tax"><ui-text msg="514">貢獻</ui-text></th>
					</tr>
				</thead>
				<tbody>
					<tr class="PositionView">
						<td class="id"></td>
						<td class="title">
							<input type="text" value="" />
						</td>
						<td class="invite">
							<div class="checkbox off"></div>
						</td>
						<td class="punish">
							<div class="checkbox off"></div>
						</td>
						<td class="storage">
							<div class="checkbox off"></div>
						</td>
						<td class="tax"><input type="text" value="0" maxlength="2" /> %</td>
					</tr>
				</tbody>
			</table>
		</div>

		<!-- SKILLS TAB -->
		<div class="content skills">
			<div class="skill_list">
				<!-- Just to get reference, will be removed -->
				<ui-button
					class="btn levelup"
					bg="basic_interface/skill_up_a.bmp"
					hover="basic_interface/skill_up_b.bmp"
					down="basic_interface/skill_up_c.bmp"
				></ui-button>
			</div>
		</div>

		<!-- HISTORY BAN TAB -->
		<div class="content history">
			<table>
				<thead>
					<tr>
						<th class="name"><ui-text msg="407">名稱</ui-text></th>
						<th class="reason"><ui-text msg="462">公會逐出原因</ui-text></th>
					</tr>
				</thead>
				<tbody>
					<tr class="ExpelView">
						<td class="name"></td>
						<td class="reason"></td>
					</tr>
				</tbody>
			</table>
		</div>

		<!-- NOTICE TAB -->
		<div class="content notice">
			<div class="subjectTitle"><ui-text msg="515">稱號</ui-text></div>
			<input type="text" class="subject" />

			<div class="noticeTitle"><ui-text msg="516">內容</ui-text></div>
			<textarea class="notice"></textarea>
		</div>
	</div>

	<div class="footer">
		<ui-image src="basic_interface/btnbar_mid2.bmp"></ui-image>
		<ui-button
			class="btn_disband"
			bg="btn_disband.bmp"
			hover="btn_disband_a.bmp"
			down="btn_disband_b.bmp"
		></ui-button>
		<ui-button class="btn_ok" bg="btn_ok.bmp" hover="btn_ok_a.bmp" down="btn_ok_b.bmp"></ui-button>
		<div class="text skpoints">技能點數: <span class="skpoints_count">0</span></div>
		<div class="sortlogin">
			<ui-button bg="checkbox_1.bmp"></ui-button><ui-text msg="2864">顯示公會成員上線狀態</ui-text>
		</div>
		<!-- The client draws btn_close beside this one at x=92. It is left out on
		     purpose, not missing: it carries the same command id as the titlebar's
		     close button, so it is a duplicate. See Guild.js. -->
		<ui-button class="btn btn_use" bg="btn_use.bmp" hover="btn_use_a.bmp" down="btn_use_b.bmp"></ui-button>
	</div>

	<!-- The whole window becomes the drop target while a file is dragged over
	     it, the emblem alone being a 24x24 target.
	     See docs/reference/guild/emblem-picker.md -->
	<div class="emblem_drop"><ui-text msg="336">公會標誌</ui-text></div>
</div>
