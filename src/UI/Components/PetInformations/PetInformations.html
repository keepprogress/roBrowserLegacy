<div id="PetInformations">
	<div class="titlebar" data-background="basic_interface/titlebar_mid.bmp">
		<div class="left">
			<span class="text" data-text="584">寵物情報</span>
		</div>
		<div class="right">
			<button
				class="base close"
				data-background="basic_interface/sys_close_off.bmp"
				data-hover="basic_interface/sys_close_on.bmp"
			></button>
		</div>
		<div class="clear"></div>
	</div>
	<div class="content">
		<div class="title_name">名稱</div>
		<input type="text" class="name" value="" />
		<div class="title_level">等級</div>
		<div class="level"></div>
		<button
			class="modify"
			data-background="btn_edit.bmp"
			data-hover="btn_edit_a.bmp"
			data-down="btn_edit_b.bmp"
		></button>

		<div class="title_hunger">滿足感</div>
		<div class="hunger"></div>
		<div class="title_intimacy">親密度</div>
		<div class="intimacy"></div>

		<div class="title_accessory">裝飾品</div>
		<div class="accessory">已裝備</div>
		<div class="feeding">
			<span data-text="2577">自動餵食</span
			><button class="pet_auto_feed" data-background="checkbox_0.bmp" data-preload="checkbox_1.bmp"></button>
		</div>

		<select class="command">
			<option value="default">&lt; 指令 &gt;</option>
			<option value="feed" data-text="592">餵食飼料</option>
			<option value="action" data-text="593">表現狀態</option>
			<option value="release" data-text="594">放回寵物蛋</option>
			<option value="unequip" data-text="595">移除裝飾品</option>
		</select>
	</div>
</div>
