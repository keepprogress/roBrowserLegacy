<div id="Stylist">
	<div class="titlebar">
		<span class="title">造型師</span>
		<button class="close-btn" title="關閉">×</button>
	</div>
	<div class="body">
		<div class="row" data-key="hair">
			<span class="label">髮型</span>
			<button class="prev">◀</button>
			<span class="value"></span>
			<button class="next">▶</button>
		</div>
		<div class="row" data-key="haircolor">
			<span class="label">髮色</span>
			<button class="prev">◀</button>
			<span class="value"></span>
			<button class="next">▶</button>
		</div>
		<div class="row" data-key="clothescolor">
			<span class="label">衣服顏色</span>
			<button class="prev">◀</button>
			<span class="value"></span>
			<button class="next">▶</button>
		</div>
		<div class="cost"></div>
		<div class="buttons">
			<button class="confirm">確認造型</button>
			<button class="cancel">取消</button>
		</div>
	</div>
</div>
