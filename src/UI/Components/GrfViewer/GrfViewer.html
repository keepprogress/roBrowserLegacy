<div id="grfviewer">
	<!-- head titlebar -->
	<div id="head">
		<div id="previous"></div>
		<div id="next"></div>
		<input type="text" value="" id="path" />
		<input type="text" value="Search..." id="search" />
	</div>

	<!-- Loading progress -->
	<div id="progress"></div>

	<!-- Context Menu -->
	<div class="overlay"></div>
	<div id="contextmenu">
		<div class="header" title="複製到剪貼簿">名稱</div>
		<hr />
		<div class="open">開啟檔案</div>
		<a class="save" href="#">解壓縮檔案</a>
		<hr />
		<div class="info">屬性</div>
	</div>

	<!-- Preview box -->
	<div id="preview">
		<div class="box"></div>
	</div>

	<!-- Message -->
	<div id="msg"></div>

	<!-- Drag drop box -->
	<div id="info">
		<h3>將 GRF 檔案拖曳至此區域即可開始</h3>
		<div class="input">
			<button>選擇檔案</button>
			<input type="file" accept="" multiple="multiple" id="file" />
		</div>
	</div>
</div>
