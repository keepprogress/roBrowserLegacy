<div id="GraphicsOption">
	<div class="titlebar" data-background="basic_interface/titlebar_mid.bmp">
		<div class="left">
			<button
				class="base"
				data-background="basic_interface/sys_base_off.bmp"
				data-hover="basic_interface/sys_base_on.bmp"
			></button>
			<span class="text" data-text="1484">畫面設定</span>
		</div>
		<div class="right">
			<button
				class="base close"
				data-background="basic_interface/sys_close_off.bmp"
				data-hover="basic_interface/sys_close_on.bmp"
			></button>
		</div>
		<div class="clear"></div>
	</div>

	<div class="tabs-container">
		<div class="tabs">
			<button class="tab-button selected" data-tab="basic">基本設定</button>
			<button class="tab-button" data-tab="advanced">進階</button>
		</div>
	</div>

	<div class="panel">
		<div class="tab-content selected" id="basic">
			<table>
				<tr>
					<td>細節</td>
					<td style="display: inline-block; width: 260px">
						<input
							class="details"
							type="range"
							value="100"
							max="100"
							min="25"
							step="5"
							style="width: 90%"
						/>
					</td>
				</tr>
				<tr class="resolution">
					<td>解析度</td>
					<td>
						<select class="screensize">
							<option value="650x480">640 x 480</option>
							<option value="800x600">800 x 600</option>
							<option value="1024x768">1024 x 768</option>
							<option value="1280x800">1280 x 800</option>
							<option value="1400x900">1400 x 900</option>
							<option value="1680x1050">1680 x 1050</option>
							<option value="full">全螢幕</option>
						</select>
					</td>
				</tr>
				<tr>
					<td>滑鼠游標</td>
					<td>
						<label>
							<input class="cursor-option" type="checkbox" />
							顯示官方滑鼠游標
						</label>
					</td>
				</tr>
				<tr>
					<td>FPS 上限</td>
					<td>
						<select class="fpslimit">
							<option value="-1">與顯示器同步</option>
							<option value="30">30</option>
							<option value="60">60</option>
							<option value="90">90</option>
							<option value="120">120</option>
						</select>
					</td>
				</tr>
				<tr>
					<td>顯示 FPS</td>
					<td>
						<label>
							<input class="fps" type="checkbox" />
						</label>
					</td>
				</tr>
			</table>
		</div>

		<div class="tab-content" id="advanced">
			<table>
				<tr>
					<td title="強制使用最近鄰過濾，以呈現像素完美的精靈圖">
						像素完美精靈圖
					</td>
					<td>
						<label>
							<input class="pixel-perfect" type="checkbox" />
							強制使用最近鄰過濾
						</label>
					</td>
				</tr>
				<tr>
					<td title="為明亮區域加上發光的泛光效果">泛光</td>
					<td>
						<label style="display: inline-block; margin-right: 20px">
							<input class="bloom" type="checkbox" />
						</label>
						<label style="display: inline-block; width: 200px">
							強度:
							<input
								class="bloom-intensity"
								type="range"
								value="0.5"
								min="0.1"
								max="3.0"
								step="0.05"
								style="width: 90%; vertical-align: middle"
							/>
						</label>
					</td>
				</tr>
				<tr>
					<td title="對畫面套用模糊效果">模糊</td>
					<td>
						<label style="display: inline-block; margin-right: 20px">
							<input class="blur" type="checkbox" />
						</label>
						<label style="display: inline-block; width: 90px">
							強度:
							<input
								class="blur-intensity"
								type="range"
								value="3.0"
								min="2.0"
								max="10.0"
								step="0.1"
								style="width: 90%; vertical-align: middle"
							/>
						</label>
						<label style="display: inline-block; width: 90px">
							範圍:
							<input
								class="blur-area"
								type="range"
								value="14.0"
								min="3.0"
								max="20.0"
								step="1.0"
								style="width: 90%; vertical-align: middle"
							/>
						</label>
					</td>
				</tr>
				<tr>
					<td title="用於增強細節的對比自適應銳化">對比自適應銳化 (CAS)</td>
					<td>
						<label style="display: inline-block; margin-right: 20px">
							<input class="casEnabled" type="checkbox" />
						</label>
						<label style="display: inline-block; width: 90px">
							對比度:
							<input
								class="casContrast"
								type="range"
								value="0.0"
								min="0.0"
								max="1.0"
								step="0.05"
								style="width: 90%; vertical-align: middle"
							/>
						</label>
						<label style="display: inline-block; width: 90px">
							銳化:
							<input
								class="casSharpening"
								type="range"
								value="1.0"
								min="0.0"
								max="1.0"
								step="0.05"
								style="width: 90%; vertical-align: middle"
							/>
						</label>
					</td>
				</tr>
				<tr>
					<td title="快速近似抗鋸齒，讓邊緣更平滑">FXAA</td>
					<td>
						<label style="display: inline-block; margin-right: 20px">
							<input class="fxaaEnabled" type="checkbox" />
						</label>
						<label style="display: inline-block; width: 90px">
							次像素:
							<input
								class="fxaaSubpix"
								type="range"
								value="0.25"
								min="0.0"
								max="1.0"
								step="0.05"
								style="width: 90%; vertical-align: middle"
							/>
						</label>
						<label style="display: inline-block; width: 90px">
							邊緣閾值:
							<input
								class="fxaaEdgeThreshold"
								type="range"
								value="0.125"
								min="0.063"
								max="0.333"
								step="0.03"
								style="width: 90%; vertical-align: middle"
							/>
						</label>
					</td>
				</tr>
				<tr>
					<td title="適用於風格化畫面的卡通渲染效果">卡通</td>
					<td>
						<label style="display: inline-block; margin-right: 20px">
							<input class="cartoonEnabled" type="checkbox" />
						</label>
						<label style="display: inline-block; width: 90px">
							強度:
							<input
								class="cartoonPower"
								type="range"
								value="1.5"
								min="0.1"
								max="9.9"
								step="0.1"
								style="width: 90%; vertical-align: middle"
							/>
						</label>
						<label style="display: inline-block; width: 90px">
							邊緣斜率:
							<input
								class="cartoonEdgeSlope"
								type="range"
								value="1.5"
								min="1.5"
								max="5.9"
								step="0.1"
								style="width: 90%; vertical-align: middle"
							/>
						</label>
					</td>
				</tr>
				<tr>
					<td title="提高色彩強度與飽和度">鮮豔度</td>
					<td>
						<label style="display: inline-block; margin-right: 20px">
							<input class="vibranceEnabled" type="checkbox" />
						</label>
						<label style="display: inline-block; width: 200px">
							強度:
							<input
								class="vibrance"
								type="range"
								value="0.15"
								min="-0.9"
								max="0.9"
								step="0.1"
								style="width: 90%; vertical-align: middle"
							/>
						</label>
					</td>
				</tr>
				<tr>
					<td
						title="隱藏可視範圍外的物件、啟用降採樣渲染等功能以提升效能"
					>
						效能模式
					</td>
					<td>
						<label style="display: inline-block; margin-right: 20px">
							<input class="performanceMode" type="checkbox" />
						</label>
						<label style="display: inline-block; width: 200px">
							剔除範圍:
							<input
								class="view-area"
								type="range"
								value="14.0"
								min="4.0"
								max="20.0"
								step="1.0"
								style="width: 90%; vertical-align: middle"
							/>
						</label>
					</td>
				</tr>
				<tr>
					<td
						title="讓遮擋角色視線的建築與樹木變為半透明（第一人稱視角下無效）。抖動較省資源，透明混合較為平滑。"
					>
						遮擋物半透明
					</td>
					<td>
						<label style="display: inline-block; margin-right: 20px">
							<select class="occluderFade">
								<option value="off">關閉</option>
								<option value="dither">抖動 (快速)</option>
								<option value="alpha">透明混合 (平滑)</option>
							</select>
						</label>
						<label style="display: inline-block; width: 120px">
							不透明度:
							<input
								class="occluderFadeOpacity"
								type="range"
								value="0.25"
								min="0.0"
								max="0.8"
								step="0.05"
								style="width: 90%; vertical-align: middle"
							/>
						</label>
						<label style="display: inline-block; width: 120px">
							範圍:
							<input
								class="occluderFadeRadius"
								type="range"
								value="5.0"
								min="1.5"
								max="12.5"
								step="0.5"
								style="width: 90%; vertical-align: middle"
							/>
						</label>
					</td>
				</tr>
			</table>

			<div class="reset-section">
				<button class="reset-button">重設為預設值</button>
			</div>
		</div>
	</div>
</div>
